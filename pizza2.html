<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Address Functionality</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* CSS for the address section */
    .no-address {
      background-color: #f8f9fa;
      border-radius: 0.375rem;
    }

    .error-message {
      color: red;
      font-weight: bold;
      margin-top: 10px;
      display: none;
    }

    /* Fix for the z-index issue with Google Maps Autocomplete */
    .address-details {
      position: relative;
      z-index: 0; /* Lower z-index than the autocomplete dropdown */
    }

    .pac-container {
      z-index: 1050 !important; /* Higher z-index to appear above other elements */
    }

    /* Additional styling for the address section */
    #locationField {
      z-index: 1;
    }

    .input-group {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body class="bg-light p-4">

  <div class="container">
    <h2 class="fw-bold mb-4">Address Input & Validation</h2>

    <div id="addressSection" class="d-flex justify-content-between align-items-center p-3 no-address mb-4">
      <div class="d-flex align-items-center gap-2">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
        </svg>
        <span>No address</span>
      </div>
      <button class="btn btn-sm text-secondary">Add address</button>
    </div>

    <div class="w-100 mt-2" style="display: none;">
      <div class="input-group">
        <input type="text" class="form-control" id="locationField" placeholder="Enter delivery address">
        <button class="btn btn-dark" id="saveAddressBtn">Save</button>
      </div>
      <div class="address-details">
        <div id="delivery-error" class="error-message">We do not deliver here</div>
        <b>Selected Address Details:</b>
        <p id="address-display">No address selected yet</p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

  <script>
    // Address Functionality
    document.addEventListener('DOMContentLoaded', function() {
      // Get the address section
      const addressSection = document.getElementById('addressSection');
      if (!addressSection) {
        console.error('Address section not found');
        return;
      }
      
      // Get the "Add address" button
      const addAddressBtn = addressSection.querySelector('button');
      if (!addAddressBtn) {
        console.error('Add address button not found');
        return;
      }
      
      // Get the left side container that has both the icon and the "No address" text
      const addressDisplay = addressSection.querySelector('.d-flex.align-items-center');
      if (!addressDisplay) {
        console.error('Address display not found');
        return;
      }
      
      // Get the span containing "No address" text
      const addressSpan = addressDisplay.querySelector('span');
      if (!addressSpan) {
        console.error('Address span not found');
        return;
      }
      
      // Create a container for the input field
      const inputContainer = document.createElement('div');
      inputContainer.className = 'w-100 mt-2';
      inputContainer.style.display = 'none';
      inputContainer.innerHTML = ` 
          <div class="input-group">
          <input type="text" class="form-control" id="locationField" placeholder="Enter delivery address">
          <button class="btn btn-dark" id="saveAddressBtn">Save</button>
        </div>
            <div class="address-details">
            <div id="delivery-error" class="error-message">We do not deliver here</div>
                <b>Selected Address Details:</b>
                <p id="address-display">No address selected yet</p>
            </div>
      `;
      
      // Convert to block display to force the input to appear below
      if (addressSection.classList.contains('d-flex')) {
        // Create a wrapper for the existing content
        const contentWrapper = document.createElement('div');
        contentWrapper.className = 'd-flex justify-content-between align-items-center w-100';
        
        // Remove the address section from flex display
        addressSection.classList.remove('d-flex');
        addressSection.classList.add('d-block');
        
        // Move existing children to the wrapper
        while (addressSection.firstChild) {
          contentWrapper.appendChild(addressSection.firstChild);
        }
        
        // Add the wrapper back to the address section
        addressSection.appendChild(contentWrapper);
      }
      
      // Add the input container to the address section
      addressSection.appendChild(inputContainer);
      
      // Handle "Add address" button click
      addAddressBtn.addEventListener('click', function() {
        if (inputContainer.style.display === 'none') {
          // Show the input field
          inputContainer.style.display = 'block';
          document.getElementById('locationField').focus();
          
          // Pre-fill if editing an existing address
          if (addressSpan.textContent !== 'No address') {
            document.getElementById('locationField').value = addressSpan.textContent;
          }
          
          // Change button text
          addAddressBtn.textContent = 'Cancel';
        } else {
          // Hide the input field
          inputContainer.style.display = 'none';
          
          // Reset button text
          if (addressSpan.textContent !== 'No address') {
            addAddressBtn.textContent = 'Edit address';
          } else {
            addAddressBtn.textContent = 'Add address';
          }
        }
      });
      
      // Handle Save button click
      document.body.addEventListener('click', function(event) {
        if (event.target.id === 'saveAddressBtn') {
          saveAddress();
        }
      });
      
      // Handle Enter key in input field
      document.body.addEventListener('keydown', function(event) {
        if (event.target.id === 'locationField' && event.key === 'Enter') {
          saveAddress();
        }
      });
      
      // Function to save the address
      function saveAddress() {
        const locationField = document.getElementById('locationField');
        const address = locationField.value.trim();
        
        if (address) {
          // Update the address text (keep the icon)
          addressSpan.textContent = address;
          
          // Remove no-address class
          addressSection.classList.remove('no-address');
          
          // Hide the input field
          inputContainer.style.display = 'none';
          
          // Change button text
          addAddressBtn.textContent = 'Edit address';
          
          // Add success animation
          addressSection.style.transition = 'background-color 0.5s';
          addressSection.style.backgroundColor = 'rgba(25, 135, 84, 0.1)';
          setTimeout(function() {
            addressSection.style.backgroundColor = '';
          }, 800);
        } else {
          // Show validation error
          locationField.classList.add('is-invalid');
          setTimeout(function() {
            locationField.classList.remove('is-invalid');
          }, 800);
        }
      }
    });

    // Google Maps API
    const referenceAddress = "264 S Whitney St, Hartford, CT 06105";
    let referenceLatLng;
    
    function initAutocomplete() {
      const geocoder = new google.maps.Geocoder();
      geocoder.geocode({ address: referenceAddress }, function(results, status) {
        if (status === "OK" && results[0]) {
          referenceLatLng = results[0].geometry.location;
        } else {
          console.error("Geocoding failed for reference address: " + status);
        }
      });
      
      const autocomplete = new google.maps.places.Autocomplete(
        document.getElementById('locationField'),
        { 
          types: ['address'],
          componentRestrictions: { country: 'us' },
          bounds: new google.maps.LatLngBounds(
            new google.maps.LatLng(40.9509, -73.7276),
            new google.maps.LatLng(42.0505, -71.7862)
          ),
          strictBounds: true
        }
      );
      
      autocomplete.addListener('place_changed', function() {
        const place = autocomplete.getPlace();
        if (!place.geometry) {
          document.getElementById('address-display').textContent = "No details available for: " + place.name;
          return;
        }
        
        const selectedLatLng = place.geometry.location;
        const formattedAddress = place.formatted_address;
        document.getElementById('address-display').textContent = formattedAddress;
        
        if (referenceLatLng) {
          const distance = calculateDistance(
            referenceLatLng.lat(), referenceLatLng.lng(),
            selectedLatLng.lat(), selectedLatLng.lng()
          );
          
          const distanceInKm = distance / 1000;
          
          if (distanceInKm > 5) {
            document.getElementById('delivery-error').style.display = 'block';
            document.getElementById('locationField').value = '';
          } else {
            document.getElementById('delivery-error').style.display = 'none';
          }
        }
      });
    }
    
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000; // Radius of Earth in meters
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
              Math.cos(φ1) * Math.cos(φ2) *
              Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const distance = R * c;
      
      return distance;
    }
  </script>
  
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDMLV2dpIzk2caBlBWTW6xYX0vgo0Muwuk&libraries=places&callback=initAutocomplete" async defer></script>
</body>
</html>
